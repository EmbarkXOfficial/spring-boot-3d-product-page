<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Cartwell</title>
  <link rel="stylesheet" th:href="@{/css/store.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="page not-found">
  <p class="not-found__code">404</p>
  <h1>Sorry, we couldn't find that page</h1>
  <p>The product you're looking for may have moved or is no longer available.</p>
  <a class="btn btn--cart not-found__link" th:href="@{/}">Continue shopping</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
