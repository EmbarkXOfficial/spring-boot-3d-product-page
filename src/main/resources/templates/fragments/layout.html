<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<header class="site-header" th:fragment="header">
  <div class="site-header__inner">
    <a class="logo" th:href="@{/}" aria-label="Cartwell home">
      <span class="logo__mark" aria-hidden="true">C</span>
      <span class="logo__text">cartwell<span class="logo__dot">.</span></span>
    </a>

    <form class="search" role="search" onsubmit="return false">
      <label class="visually-hidden" for="search-input">Search Cartwell</label>
      <input id="search-input" class="search__input" type="search" placeholder="Search bags, brands and more">
      <button class="search__button" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <path d="M20 20l-4.2-4.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <a class="cart" href="#" aria-label="Cart, 0 items">
      <span class="cart__icon">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path d="M3 4h2.2l2.3 10.4a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 8H6.3"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="9.5" cy="19.5" r="1.5" fill="currentColor"/>
          <circle cx="17.5" cy="19.5" r="1.5" fill="currentColor"/>
        </svg>
        <span class="cart__count">0</span>
      </span>
      <span class="cart__label">Cart</span>
    </a>
  </div>
</header>

<footer class="site-footer" th:fragment="footer">
  <div class="site-footer__inner">
    <p class="site-footer__note">Cartwell and Maison Vale are fictional names for a demo store. Nothing here is for sale.</p>
  </div>
</footer>

</body>
</html>
